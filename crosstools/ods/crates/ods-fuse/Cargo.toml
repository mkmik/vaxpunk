[package]
name = "ods-fuse"
description = "ods-fuse: mount a Files-11 disk image (read-only)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ods-image = { path = "../ods-image" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

# macOS mounts through macFUSE's libfuse; Linux speaks the kernel protocol.
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.18", features = ["libfuse2", "macfuse-4-compat"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fuser = "0.18"
