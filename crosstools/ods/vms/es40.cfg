// AlphaServer ES40 for AXPbox: the OpenVMS CD and three scratch disks, all
// on the Symbios SCSI controller (booting from the IDE CD fails half the
// time on this emulator). Console: telnet 127.0.0.1:21264.
sys0 = tsunami
{
  memory.bits = 29;                       // 512 MB
  rom.srm = "rom/cl67srmrom.exe";
  rom.decompressed = "rom/decompressed.rom";
  rom.flash = "rom/flash.rom";
  rom.dpr = "rom/dpr.rom";
  cpu0 = ev68cb { speed = 800M; skip_memtest_hack = true; }
  serial0 = serial { address = "127.0.0.1"; port = 21264; }
  pci0.7 = ali { vga_console = false; }
  pci0.15 = ali_ide {}
  pci0.19 = ali_usb {}
  pci0.3 = sym53c810
  {
    disk0.0 = file { file = "disk1.img"; }   // DKA0
    disk0.1 = file { file = "disk2.img"; }   // DKA100
    disk0.2 = file { file = "disk3.img"; }   // DKA200
    disk0.4 = file { file = "../fixtures/alpha-8.4-2l1.iso"; cdrom = true; read_only = true; }  // DKA400
  }
}
