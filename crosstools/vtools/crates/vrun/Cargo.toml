[package]
name = "vrun"
description = "Runs vaxpunk images at EL0 in a bare-metal QEMU virt machine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vms-obj = { path = "../vms-obj" }

[dev-dependencies]
vasm = { path = "../vasm" }
vbliss = { path = "../vbliss" }
vcdu = { path = "../vcdu" }
vlib = { path = "../vlib" }
vlink = { path = "../vlink" }
vmacro = { path = "../vmacro" }
# Renders what TPU sends the terminal in its tests, as a VT100 would.
vt100 = "0.16.2"
