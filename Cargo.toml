[workspace]
resolver = "3"
members = ["ods/crates/*", "vtools/crates/*", "kernel", "shim", "tcpip", "roottask", "image", "apidoc"]
# kernel, shim, tcpip, roottask and image (boot) build C with the cross toolchain from
# scripts/setup-host.sh, so a plain cargo build or test leaves them out.
default-members = ["ods/crates/*", "vtools/crates/*", "apidoc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
