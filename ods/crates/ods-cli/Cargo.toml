[package]
name = "ods-cli"
description = "ods: inspect and change Files-11 disk images"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ods"
path = "src/main.rs"

[dependencies]
ods-image = { path = "../ods-image" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"
