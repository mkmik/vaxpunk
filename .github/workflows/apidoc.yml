name: apidoc

# docs/api/index.html is generated from the sources by cargo run -p apidoc.
# It isn't committed, so parallel PRs don't conflict on it: every PR checks
# that it still generates, and main publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run -p apidoc
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

  deploy:
    if: github.event_name == 'push'
    needs: current
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency: pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
