name: apidoc

# docs/api/index.html is generated from the sources by cargo run -p apidoc:
# fail if it wasn't regenerated with them.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run -p apidoc
      - name: docs/api is current
        run: |
          git diff --exit-code docs/api || { echo "::error::docs/api is stale: run cargo run -p apidoc and commit it"; exit 1; }
