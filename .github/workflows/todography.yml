name: todography

# docs/map/ is the map of components: every label must name something, and
# no change may leave a warning behind (an aspiration something wanted needs,
# a cycle, an induced component nothing needs). See docs/map/README.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mkmik/todography@dad94ed9bcb73a01c4e462a365e5168fea9f4f98 # v0.12.0
        with:
          args: --strict
      - run: todography build
