name: rust

# The Cargo workspace. Its default members, crosstools/ and vms/ (the
# system disk), are built and tested. The seL4 crates (pal/ and boot/) need
# the cross C toolchain, so here CI only checks their formatting.
# boot.yml builds and boots them.
# vrun's tests run CLITEST, the command parser's check, from vms/sysexe,
# and CDU$COMPILE, SET COMMAND's compiler, on vms/cld's CLD.
on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "*/*.rs", "*/Cargo.toml", "pal/*/*.rs", "pal/*/Cargo.toml", "crosstools/**", "vms/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "*/*.rs", "*/Cargo.toml", "pal/*/*.rs", "pal/*/Cargo.toml", "crosstools/**", "vms/**", ".github/workflows/rust.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is off: slow, and rarely needed for kernel work. To bring it
        # back, add macos-latest here; the "macOS packages" step is still in place.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target aarch64-unknown-none
          rustup default stable
      # FUSE for ods-fuse; cross binutils (vrun's boot stub, vasm's GNU as
      # oracle), the cross gcc (vtools' examples/c), QEMU for vtools.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse3-dev fuse3 pkg-config binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu qemu-system-arm
      - name: macOS packages
        if: runner.os == 'macOS'
        run: |
          brew install --cask macfuse
          brew install aarch64-elf-binutils aarch64-elf-gcc qemu
      - name: The ods CLI and FUSE daemon use ods-image only
        run: |
          ! grep -rn 'ods-core' crosstools/ods/crates/ods-cli/Cargo.toml crosstools/ods/crates/ods-fuse/Cargo.toml &&
          ! grep -rn 'ods_core' crosstools/ods/crates/ods-cli/src crosstools/ods/crates/ods-fuse/src
      - name: The libraries the OS will use build without std
        run: cargo build -p ods-core -p vms-obj --target aarch64-unknown-none
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Fixtures
        run: crosstools/ods/fixtures/fetch.sh
      - run: cargo test --release
