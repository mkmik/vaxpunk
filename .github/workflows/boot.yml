name: boot

# Builds the OS with the cross toolchain and boots it in QEMU: cargo test -p
# boot. The toolchain is a container image, .github/toolchain.Dockerfile,
# kept on ghcr.io under the Dockerfile's hash and built only when that tag
# is missing. On main, or when run by hand, it then builds the GitHub Pages
# site, web/mksite.sh's: the landing page, the API reference, the map and the demo,
# the images just booted on QEMU compiled to WebAssembly. Main publishes it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-toolchain:${{ hashFiles('.github/toolchain.Dockerfile') }}" >> "$GITHUB_OUTPUT"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push unless already there
        run: |
          image=${{ steps.tag.outputs.image }}
          docker manifest inspect "$image" >/dev/null 2>&1 && exit 0
          docker build -t "$image" -f .github/toolchain.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} .github
          docker push "$image"

  boot:
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - run: cargo test --release -p boot
      # The browser's QEMU is 32-bit wasm with 2.3 GB: the demo's kernel is
      # built for 1 GB, web/demo/index.html's -m.
      - if: github.event_name != 'pull_request'
        name: Gzip the demo's firmware and disks
        run: |
          QEMU_MEM=1024 cargo run --release -p boot -- --images
          web/demo-images.sh out/demo
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-images
          path: out/demo
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: serial.log
          path: out/serial.log

  # qemu-system-aarch64 for the browser takes the better part of an hour to
  # build: it's cached under web/qemu-wasm.sh's hash, which pins its sources.
  qemu-wasm:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: qemu-wasm
          key: qemu-wasm-${{ hashFiles('web/qemu-wasm.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: web/qemu-wasm.sh qemu-wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qemu-wasm
          path: qemu-wasm

  site:
    needs: [boot, qemu-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: web/tailgate/go.mod
          cache-dependency-path: web/tailgate/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: demo-images
          path: demo-images
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qemu-wasm
          path: qemu-wasm
      # Lints the map and puts todography on PATH for mksite.sh's build.
      - uses: mkmik/todography@dad94ed9bcb73a01c4e462a365e5168fea9f4f98 # v0.12.0
      - run: web/mksite.sh site qemu-wasm demo-images
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  # Only main deploys: the github-pages environment rejects other branches,
  # where running this by hand builds QEMU and the site as a check.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency: pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
